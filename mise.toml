# mise.toml - Root orchestrator for BruntWork Claude Code Screening
#
# Hierarchy: Root = [tools] + [env] + orchestration
# Pattern: polyglot monorepo with Python (Google Forms API) + Bun (validation)

[env]
# CORRECT: read_file() - no subprocess spawning (prevents process storms)
GH_TOKEN = "{{ read_file(path=env.HOME ~ '/.claude/.secrets/gh-token-terrylica') | trim }}"
GITHUB_TOKEN = "{{ read_file(path=env.HOME ~ '/.claude/.secrets/gh-token-terrylica') | trim }}"

# Project-specific
LOG_DIR = "{{config_root}}/logs"
QUIZ_DATA_DIR = "{{config_root}}/quiz-data"
ENV = "dev"

[tools]
python = "3.13"
node = "lts"
bun = "latest"
uv = "latest"

# === Quiz Management Tasks ===

[tasks."quiz:validate"]
description = "Validate quiz JSON files against schema"
sources = ["quiz-data/*.json", "scripts/validate-quiz.py"]
outputs = ["logs/quiz-validation.log"]
run = "uv run scripts/validate-quiz.py"

[tasks."quiz:list"]
description = "List all available quizzes"
run = "ls -la quiz-data/*.json"

# === Google Forms Tasks ===

[tasks."forms:create"]
description = "Create Google Forms from quiz JSON"
depends = ["quiz:validate"]
sources = ["quiz-data/*.json", "google-forms-setup/create_forms.py"]
outputs = ["google-forms-setup/created_forms.json"]
run = "uv run google-forms-setup/create_forms.py --all"

[tasks."forms:create-single"]
description = "Create single Google Form (pass quiz name as arg)"
run = "uv run google-forms-setup/create_forms.py --quiz"

[tasks."forms:audit"]
description = "Generate audit report for created forms"
sources = ["google-forms-setup/created_forms.json"]
outputs = ["google-forms-setup/audit-reports/MASTER-SUMMARY.md"]
run = "uv run google-forms-setup/audit_forms.py"

[tasks."forms:fetch-responses"]
description = "Fetch responses from created forms"
run = "uv run google-forms-setup/fetch_responses.py"

[tasks."forms:add-fields"]
description = "Add candidate info fields to forms"
run = "uv run google-forms-setup/add_candidate_fields.py"

[tasks."quiz:validate-citations"]
description = "Validate citation URLs and access dates"
sources = ["quiz-data/*.json", "scripts/validate-citations.py"]
run = "uv run scripts/validate-citations.py"

[tasks."review:generate"]
description = "Generate quiz review page with full answer key"
sources = ["quiz-data/*.json", "scripts/generate-review-page.py"]
outputs = ["docs/review.md"]
run = "uv run scripts/generate-review-page.py"
depends = ["quiz:validate"]

# === Release Tasks (file-based in .mise/tasks/release/) ===

[tasks."release:preflight"]
description = "Phase 1: Validate prerequisites for release"
run = "bash .mise/tasks/release/preflight"

[tasks."release:generate"]
description = "Phase 2: Auto-generate review page and forms"
depends = ["quiz:validate"]
run = "bash .mise/tasks/release/generate"

[tasks."release:version"]
description = "Phase 3: Run semantic-release"
run = "bash .mise/tasks/release/version"

[tasks."release:full"]
description = "Complete release workflow: preflight → generate → version"
depends = ["release:preflight", "release:generate"]
run = "mise run release:version"

# === Development Tasks ===

[tasks.dev]
description = "Start development environment"
run = """
echo "📋 BruntWork Claude Code Screening"
echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
echo ""
echo "Quiz Management:"
echo "  mise run quiz:validate         - Validate quiz JSON files"
echo "  mise run quiz:validate-citations - Validate citation URLs"
echo "  mise run review:generate       - Regenerate docs/review.md"
echo ""
echo "Google Forms:"
echo "  mise run forms:create          - Deploy quizzes to Google Forms"
echo "  mise run forms:add-fields      - Add Name/Role fields"
echo "  mise run forms:audit           - Generate audit reports"
echo ""
echo "Release (full pipeline):"
echo "  mise run release:preflight     - Phase 1: Validate prerequisites"
echo "  mise run release:generate      - Phase 2: SSoT → docs + forms"
echo "  mise run release:version       - Phase 3: semantic-release"
echo "  mise run release:full          - Complete workflow (all phases)"
echo ""
echo "Cal.com Booking:"
echo "  mise run calcom:preflight      - Check GCP deployment readiness"
echo ""
"""

[tasks.clean]
description = "Clean generated files"
run = """
rm -rf logs/*.log
rm -f google-forms-setup/created_forms.json
rm -f google-forms-setup/token.json
echo "✓ Cleaned generated files"
"""

# === Watch Mode for Development ===
# Usage: mise watch quiz:validate

[tasks."watch:quiz"]
description = "Watch quiz-data for changes and validate"
run = "mise watch quiz:validate"

# === Cal.com Booking Infrastructure ===

[tasks."calcom:preflight"]
description = "Preflight check for Cal.com GCP deployment (reads from .mise.local.toml)"
run = """
echo "Cal.com Booking - Preflight Check"
echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
echo ""
if [ -z "$CALCOM_GCP_PROJECT" ] || [ -z "$CALCOM_GCP_ACCOUNT" ]; then
  echo "ERROR: CALCOM_GCP_PROJECT or CALCOM_GCP_ACCOUNT not set."
  echo "Ensure .mise.local.toml exists with Cal.com env vars."
  exit 1
fi
echo "GCP Project:  $CALCOM_GCP_PROJECT"
echo "GCP Account:  $CALCOM_GCP_ACCOUNT"
echo "GCP Region:   ${CALCOM_GCP_REGION:-us-central1}"
echo ""
echo "Checking gcloud auth..."
gcloud auth list --filter="account:$CALCOM_GCP_ACCOUNT" --format="value(status)" 2>/dev/null || echo "NOT AUTHENTICATED"
echo ""
echo "Checking enabled APIs..."
gcloud services list --enabled --project="$CALCOM_GCP_PROJECT" --account="$CALCOM_GCP_ACCOUNT" 2>/dev/null | grep -E "run|artifact|build" || echo "APIs not enabled"
echo ""
echo "Checking Cloud Run services..."
gcloud run services list --project="$CALCOM_GCP_PROJECT" --account="$CALCOM_GCP_ACCOUNT" --region="${CALCOM_GCP_REGION:-us-central1}" 2>/dev/null || echo "No Cloud Run services yet"
"""

# === Hooks ===
# Note: .mise.local.toml is loaded automatically by mise on directory entry.
# No [hooks.enter] section needed for secret loading.
